_directories()</text><text x="71.035" y="254.561" fill="#000" font-size="15" textLength="170.083" font-family="Arial">algorithms_*.csv einlesen</text><text x="71.035" y="271.81" fill="#000" font-size="15" textLength="218.474" font-family="Arial">dataset und sourceFile ergänzen</text><text x="71.035" y="289.058" fill="#000" font-size="15" textLength="331.824" font-family="Arial">Zu einem Rohdaten-DataFrame zusammenführen</text><rect x="68.96" y="322.237" width="335.974" height="88.994" fill="#F2F7F7" style="stroke:#376668;stroke-width:0.5;"/><text x="78.96" y="346.307" fill="#000" font-size="15" textLength="130.071" font-family="Arial">aggregate_results()</text><text x="78.96" y="363.555" fill="#000" font-size="15" textLength="215.947" font-family="Arial">Numerische Spalten umwandeln</text><text x="78.96" y="380.804" fill="#000" font-size="15" textLength="241.765" font-family="Arial">Erfolgreiche Hops/Stretch markieren</text><text x="78.96" y="398.052" fill="#000" font-size="15" textLength="315.974" font-family="Arial">failureParameter aus failFactor oder failureStart</text><rect x="61.665" y="431.231" width="350.564" height="123.491" fill="#F2F7F7" style="stroke:#376668;stroke-width:0.5;"/><text x="71.665" y="455.301" fill="#000" font-size="15" textLength="260.947" font-family="Arial">Nach Dataset, Fehlertyp, Fehlermodell,</text><text x="71.665" y="472.549" fill="#000" font-size="15" textLength="309.316" font-family="Arial">Failure-Parameter und Algorithmus gruppieren</text><text x="71.665" y="489.798" fill="#000" font-size="15" textLength="182.153" font-family="Arial">resilience = mean(success)</text><text x="71.665" y="507.046" fill="#000" font-size="15" textLength="330.564" font-family="Arial">avgHops / avgStretch = mean(erfolgreiche Werte)</text><text x="71.665" y="524.295" fill="#000" font-size="15" textLength="158.005" font-family="Arial">samples = Zeilenanzahl</text><text x="71.665" y="541.543" fill="#000" font-size="15" textLength="179.634" font-family="Aria