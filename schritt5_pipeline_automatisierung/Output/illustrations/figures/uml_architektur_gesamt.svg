<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img" aria-labelledby="title desc">
  <title id="title">Gesamtarchitektur der Experimentierumgebung</title>
  <desc id="desc">UML-Komponentendiagramm der Bedienung, Pipeline-Steuerung, Experimentausführung, Auswertung, Ergebnisablage, Tests und Erweiterungspunkte.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 500 32px Arial, sans-serif; fill: #172033; }
      .package { fill: #fafbfc; stroke: #64748b; stroke-width: 2; }
      .package-label { font: 500 24px Arial, sans-serif; fill: #243247; }
      .box { stroke: #475569; stroke-width: 2; rx: 5; ry: 5; }
      .head { font: 500 23px Arial, sans-serif; fill: #172033; }
      .body { font: 400 18px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .label-bg { fill: #ffffff; opacity: .94; }
      .edge-label { font: 400 16px Arial, sans-serif; fill: #334155; }
      .legend { font: 400 16px Arial, sans-serif; fill: #475569; }
      .glyph { fill: none; stroke: #475569; stroke-width: 1.7; }
    </style>
  </defs>

  <text x="950" y="38" text-anchor="middle" class="title">Gesamtarchitektur der Experimentierumgebung</text>

  <!-- Benutzer -->
  <g aria-label="Benutzer">
    <circle cx="66" cy="118" r="20" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M66 138 V196 M32 160 H100 M66 196 L36 238 M66 196 L96 238" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="66" y="267" text-anchor="middle" class="head">Benutzer</text>
  </g>

  <!-- Bedienung -->
  <rect x="155" y="62" width="1590" height="190" class="package" rx="5"/>
  <rect x="155" y="62" width="344" height="36" fill="#eaf3ff" stroke="#64748b" stroke-width="2"/>
  <text x="172" y="88" class="package-label">Bedienung und Konfiguration</text>

  <g aria-label="Streamlit-GUI">
    <rect x="220" y="120" width="330" height="104" class="box" fill="#eaf3ff"/>
    <text x="385" y="151" text-anchor="middle" class="head">Streamlit-GUI</text>
    <text x="385" y="177" text-anchor="middle" class="body">gui.py</text>
    <text x="385" y="203" text-anchor="middle" class="small">Konfiguration, Start, Fortschritt</text>
    <rect x="515" y="133" width="20" height="13" class="glyph"/><rect x="506" y="139" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="JSON-Konfiguration">
    <path d="M650 120 H1044 L1068 144 V224 H650 Z" class="box" fill="#f4f4f5"/>
    <path d="M1044 120 V144 H1068" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="859" y="156" text-anchor="middle" class="head">JSON-Konfiguration</text>
    <text x="859" y="183" text-anchor="middle" class="body">config/*.json</text>
    <text x="859" y="207" text-anchor="middle" class="small">oder gui_config.json</text>
  </g>

  <g aria-label="Kommandozeile">
    <rect x="1180" y="120" width="360" height="104" class="box" fill="#eaf3ff"/>
    <text x="1360" y="151" text-anchor="middle" class="head">Kommandozeile</text>
    <text x="1360" y="177" text-anchor="middle" class="body">pipeline.py::main</text>
    <text x="1360" y="203" text-anchor="middle" class="small">Optionen und Overrides</text>
    <rect x="1505" y="133" width="20" height="13" class="glyph"/><rect x="1496" y="139" width="20" height="13" class="glyph"/>
  </g>

  <!-- Pipeline -->
  <rect x="155" y="282" width="1590" height="174" class="package" rx="5"/>
  <rect x="155" y="282" width="260" height="36" fill="#fff4e5" stroke="#64748b" stroke-width="2"/>
  <text x="172" y="308" class="package-label">Pipeline-Steuerung</text>

  <g aria-label="Pipeline">
    <rect x="420" y="330" width="760" height="100" class="box" fill="#fff4e5"/>
    <text x="800" y="359" text-anchor="middle" class="head">Pipeline - pipeline.py</text>
    <text x="800" y="386" text-anchor="middle" class="body">Konfiguration und Vorabprüfung · Experimentplan und Orchestrierung</text>
    <text x="800" y="412" text-anchor="middle" class="small">Dry Run · Preflight · Provenienz · Fortschritt · Metadaten</text>
    <rect x="1145" y="343" width="20" height="13" class="glyph"/><rect x="1136" y="349" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Laufzeitprüfung">
    <rect x="1280" y="330" width="350" height="100" class="box" fill="#fff4e5"/>
    <text x="1455" y="359" text-anchor="middle" class="head">Laufzeitprüfung</text>
    <text x="1455" y="386" text-anchor="middle" class="body">src/runtime_support.py</text>
    <text x="1455" y="412" text-anchor="middle" class="small">Python- und Paketprüfung</text>
    <rect x="1595" y="343" width="20" height="13" class="glyph"/><rect x="1586" y="349" width="20" height="13" class="glyph"/>
  </g>

  <!-- Experimentkern -->
  <rect x="155" y="486" width="1590" height="206" class="package" rx="5"/>
  <rect x="155" y="486" width="238" height="36" fill="#ebf8f2" stroke="#64748b" stroke-width="2"/>
  <text x="172" y="512" class="package-label">Experimentkern</text>

  <g aria-label="Graphdaten">
    <path d="M190 548 H468 L492 572 V654 H190 Z" class="box" fill="#f4f4f5"/>
    <path d="M468 548 V572 H492" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="341" y="580" text-anchor="middle" class="head">Graphdaten</text>
    <text x="341" y="607" text-anchor="middle" class="body">synthetische Parameter</text>
    <text x="341" y="633" text-anchor="middle" class="small">Topology-Zoo-GraphML</text>
  </g>

  <g aria-label="Experimentsteuerung">
    <rect x="560" y="538" width="380" height="128" class="box" fill="#ebf8f2"/>
    <text x="750" y="567" text-anchor="middle" class="head">Experimentsteuerung</text>
    <text x="750" y="593" text-anchor="middle" class="body">src/experiment.py</text>
    <text x="750" y="619" text-anchor="middle" class="small">Graph, Endpunkte, Seed, Wiederholungen</text>
    <text x="750" y="643" text-anchor="middle" class="small">Resume und Rohdatenzeilen</text>
    <rect x="905" y="551" width="20" height="13" class="glyph"/><rect x="896" y="557" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Fehlermodelle">
    <rect x="1000" y="548" width="300" height="108" class="box" fill="#fff1f2"/>
    <text x="1150" y="578" text-anchor="middle" class="head">Fehlermodelle</text>
    <text x="1150" y="605" text-anchor="middle" class="body">src/failures.py</text>
    <text x="1150" y="631" text-anchor="middle" class="small">Random/Clustered · Link/Node</text>
    <rect x="1265" y="561" width="20" height="13" class="glyph"/><rect x="1256" y="567" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Routingalgorithmen">
    <rect x="1370" y="538" width="340" height="128" class="box" fill="#eaf3ff"/>
    <text x="1540" y="567" text-anchor="middle" class="head">Routingalgorithmen</text>
    <text x="1540" y="593" text-anchor="middle" class="body">src/routing_algorithms.py</text>
    <text x="1540" y="619" text-anchor="middle" class="small">EDP/NDP · Paths/One/Multiple Trees</text>
    <text x="1540" y="643" text-anchor="middle" class="small">Routing und Hopzählung</text>
    <rect x="1675" y="551" width="20" height="13" class="glyph"/><rect x="1666" y="557" width="20" height="13" class="glyph"/>
  </g>

  <!-- Auswertung -->
  <rect x="155" y="722" width="1590" height="198" class="package" rx="5"/>
  <rect x="155" y="722" width="382" height="36" fill="#f3eeff" stroke="#64748b" stroke-width="2"/>
  <text x="172" y="748" class="package-label">Auswertung und Ergebnisablage</text>

  <g aria-label="Rohdaten">
    <path d="M205 790 H480 L504 814 V882 H205 Z" class="box" fill="#f4f4f5"/>
    <path d="M480 790 V814 H504" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="355" y="823" text-anchor="middle" class="head">Rohdaten</text>
    <text x="355" y="852" text-anchor="middle" class="body">raw/&lt;dataset&gt;/*.csv</text>
  </g>

  <g aria-label="Ergebnisanalyse">
    <rect x="610" y="778" width="430" height="116" class="box" fill="#f3eeff"/>
    <text x="825" y="808" text-anchor="middle" class="head">Ergebnisanalyse</text>
    <text x="825" y="835" text-anchor="middle" class="body">evaluation/result_analysis.py</text>
    <text x="825" y="862" text-anchor="middle" class="small">Aggregation · Vollständigkeit · Metriken · Plots</text>
    <rect x="1005" y="791" width="20" height="13" class="glyph"/><rect x="996" y="797" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Auswertungsergebnisse">
    <path d="M1130 790 H1394 L1418 814 V882 H1130 Z" class="box" fill="#f4f4f5"/>
    <path d="M1394 790 V814 H1418" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="1274" y="821" text-anchor="middle" class="head">Auswertung</text>
    <text x="1274" y="848" text-anchor="middle" class="body">Summary-CSV</text>
    <text x="1274" y="872" text-anchor="middle" class="small">PNG- und SVG-Plots</text>
  </g>

  <g aria-label="Laufmetadaten">
    <path d="M1490 790 H1694 L1718 814 V882 H1490 Z" class="box" fill="#f4f4f5"/>
    <path d="M1694 790 V814 H1718" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="1604" y="821" text-anchor="middle" class="head">Laufmetadaten</text>
    <text x="1604" y="848" text-anchor="middle" class="small">used_config.json</text>
    <text x="1604" y="872" text-anchor="middle" class="small">manifest.json</text>
  </g>

  <!-- Nebenmodule -->
  <rect x="155" y="950" width="1590" height="174" class="package" rx="5"/>
  <rect x="155" y="950" width="390" height="36" fill="#fff1f2" stroke="#64748b" stroke-width="2"/>
  <text x="172" y="976" class="package-label">Nebenmodule und Erweiterbarkeit</text>

  <g aria-label="Illustrationsmodul">
    <rect x="205" y="1002" width="390" height="94" class="box" fill="#fff1f2"/>
    <text x="400" y="1032" text-anchor="middle" class="head">Illustrationsmodul</text>
    <text x="400" y="1059" text-anchor="middle" class="body">create_thesis_figures.py</text>
    <text x="400" y="1083" text-anchor="middle" class="small">Abbildungen für die Ausarbeitung</text>
    <rect x="560" y="1015" width="20" height="13" class="glyph"/><rect x="551" y="1021" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Automatisierte Tests">
    <rect x="660" y="1002" width="350" height="94" class="box" fill="#f4f4f5"/>
    <text x="835" y="1032" text-anchor="middle" class="head">Automatisierte Tests</text>
    <text x="835" y="1059" text-anchor="middle" class="body">tests/test_*.py</text>
    <text x="835" y="1083" text-anchor="middle" class="small">Unit-, Regression- und GUI-Tests</text>
    <rect x="975" y="1015" width="20" height="13" class="glyph"/><rect x="966" y="1021" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Erweiterungspunkte">
    <rect x="1080" y="994" width="430" height="110" class="box" fill="#ebf8f2"/>
    <text x="1295" y="1024" text-anchor="middle" class="head">Registrierte Erweiterungspunkte</text>
    <text x="1295" y="1052" text-anchor="middle" class="small">Grapharten und Endpunktregeln · Fehlermodelle</text>
    <text x="1295" y="1078" text-anchor="middle" class="small">Algorithmen · Plotbeschriftungen und Farben</text>
    <rect x="1475" y="1007" width="20" height="13" class="glyph"/><rect x="1466" y="1013" width="20" height="13" class="glyph"/>
  </g>

  <g aria-label="Externe Bibliotheken">
    <path d="M1570 1010 C1550 990 1585 977 1610 991 C1622 966 1670 968 1682 993 C1719 984 1740 1015 1718 1036 C1740 1055 1716 1085 1684 1075 H1605 C1570 1085 1546 1055 1570 1034 C1554 1027 1552 1018 1570 1010 Z" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="1645" y="1024" text-anchor="middle" class="head">Bibliotheken</text>
    <text x="1645" y="1050" text-anchor="middle" class="small">NetworkX · Pandas</text>
    <text x="1645" y="1073" text-anchor="middle" class="small">Matplotlib · Streamlit</text>
  </g>

  <!-- Hauptverbindungen -->
  <path d="M101 165 H220" class="arrow"/>
  <path d="M95 145 C120 80 1080 82 1180 145" class="arrow"/>
  <path d="M550 172 H650" class="arrow"/>
  <path d="M385 224 V285 H610 V330" class="arrow"/>
  <path d="M859 224 V300 H800 V330" class="arrow"/>
  <path d="M1360 224 V285 H990 V330" class="arrow"/>
  <path d="M1180 380 H1280" class="dependency"/>
  <path d="M750 430 V538" class="arrow"/>
  <path d="M492 602 H560" class="arrow"/>
  <path d="M940 580 H1000" class="arrow"/>
  <path d="M940 552 V528 H1350 V580 H1370" class="arrow"/>
  <path d="M750 666 V710 H355 V790" class="arrow"/>
  <path d="M504 836 H610" class="arrow"/>
  <path d="M900 430 V470 H970 V720 H825 V778" class="arrow"/>
  <path d="M1040 836 H1130" class="arrow"/>
  <path d="M1100 430 H1728 V770 H1604 V790" class="arrow"/>

  <!-- Beschriftungen der Hauptverbindungen -->
  <rect x="550" y="145" width="100" height="24" class="label-bg"/><text x="600" y="163" text-anchor="middle" class="edge-label">erzeugt</text>
  <rect x="720" y="267" width="150" height="24" class="label-bg"/><text x="795" y="285" text-anchor="middle" class="edge-label">Versuchsparameter</text>
  <rect x="770" y="450" width="110" height="24" class="label-bg"/><text x="825" y="468" text-anchor="middle" class="edge-label">geplante Jobs</text>
  <rect x="948" y="549" width="82" height="23" class="label-bg"/><text x="989" y="566" text-anchor="middle" class="edge-label">Auswahl</text>
  <rect x="1124" y="515" width="126" height="23" class="label-bg"/><text x="1187" y="532" text-anchor="middle" class="edge-label">Routingaufruf</text>

  <!-- Abhängigkeiten der Nebenmodule -->
  <path d="M400 1002 V940 H535 V690 H620 V666" class="dependency"/>

  <!-- Legende -->
  <line x1="174" y1="1152" x2="230" y2="1152" class="arrow"/>
  <text x="244" y="1158" class="legend">Aufruf oder Datenfluss</text>
  <line x1="505" y1="1152" x2="561" y2="1152" class="dependency"/>
  <text x="575" y="1158" class="legend">verwendet, prüft oder erweitert</text>
  <text x="1730" y="1158" text-anchor="end" class="legend">Ausfälle werden im Experimentkern erzeugt; die Auswertung liest die Rohdaten erneut ein.</text>
</svg>
